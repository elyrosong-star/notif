name: Build Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: alertes-windows, path: dist/*.exe }
      - name: Joindre le .exe à la Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.exe }
